#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release

on:
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+**"
  pull_request:

permissions:
  contents: write # Needed to create releases
  id-token: write # Needed for tokenless uploads if configured

jobs:
  plan:
    name: Plan Build
    runs-on: ubuntu-22.04
    outputs:
      manifest-path: ${{ steps.plan.outputs.manifest-path }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install cargo-dist
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm cargo-dist

      - name: Plan Release
        id: plan
        run: |
          mkdir -p artifacts
          dist plan --output-format=json > artifacts/plan.json

          echo "manifest-path=artifacts/plan.json" >> $GITHUB_OUTPUT
          echo "tag=${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}" >> $GITHUB_OUTPUT
          echo "publish=$(jq -r '.publishing.publish' artifacts/plan.json)" >> $GITHUB_OUTPUT
          echo "matrix=$(jq -c '.build.steps[] | select(.uses == null) | .target' artifacts/plan.json | jq -s '{"include": map({target: .})}')" >> $GITHUB_OUTPUT

      - name: Upload Plan Manifest
        uses: actions/upload-artifact@v4
        with:
          name: plan-manifest
          path: artifacts/plan.json

  build-local-artifacts:
    name: Build (${{ matrix.target }})
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '' }}
    strategy:
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install cargo-dist
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm cargo-dist

      - name: Download Plan Manifest
        uses: actions/download-artifact@v4
        with:
          name: plan-manifest
          path: artifacts

      - name: Build Local Artifacts
        run: dist build --target=${{ matrix.target }} --manifest-path artifacts/plan.json

      - name: Upload Local Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-artifacts-${{ matrix.target }}
          path: dist/artifacts/

  build-global-artifacts:
    name: Build Global Artifacts
    needs: [plan, build-local-artifacts]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-dist
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm cargo-dist

      - name: Download Plan Manifest
        uses: actions/download-artifact@v4
        with:
          name: plan-manifest
          path: artifacts

      - name: Build Global Artifacts
        run: dist build --artifacts=global --manifest-path artifacts/plan.json

      - name: Upload Global Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: global-artifacts
          path: dist/artifacts/

  host:
    name: Host Artifacts & Create Release
    needs: [plan, build-local-artifacts, build-global-artifacts]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-dist
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm cargo-dist

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts

      - name: Flatten Artifacts
        run: |
          mkdir -p flat-artifacts
          find dist/artifacts -type f -exec cp {} flat-artifacts/ \;

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" flat-artifacts/* \
            --title "Release ${{ github.ref_name }}" \
            --notes "This release was created via cargo-dist automation 🚀"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  announce:
    name: Announce Release
    needs: host
    if: always() && needs.host.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: Announce (Placeholder)
        run: echo "🎉 Release ${{ github.ref_name }} has been published!"
